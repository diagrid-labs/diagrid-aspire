name: "CI"

# The offline suites: no secrets, no network beyond NuGet, no Diagrid account. The diagrid CLI is replaced by
# tests/FakeDiagrid. Runs on both platforms because the package is consumed on both and the fake's location,
# executable bit and PATH handling differ between them. Make this check required for merging.
on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Test (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: "Checkout"
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The SDK band comes from global.json, so the workflow and the repo cannot drift apart.
      - name: "Setup dotnet"
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          # The SDK that builds, and the only runtime the suites need while every project is net10.0.
          # A suite that targets anything below the SDK band needs its runtime installed here as well;
          # FrameworkCoverageTests fails naming the framework if that is ever forgotten.
          global-json-file: global.json

      # Analyzers run inside this build, and Directory.Build.props makes a warning fatal for the shipped package,
      # so a new CA/IDE violation in Hosting.Diagrid fails here rather than drifting in unnoticed.
      - name: "Build"
        run: dotnet build

      # The formatting rules dotnet build does not enforce (whitespace, import order, final newline, charset).
      # ubuntu only: .gitattributes pins the working tree to LF, so the verdict is the same on either runner.
      - name: "Format check"
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format --verify-no-changes --no-restore

      # Each dotnet test below runs the suite on every framework the package ships, which is net10.0 alone
      # since Aspire 17 dropped net8.0 and net9.0. The matrix stays on OS only; the framework dimension
      # lives in the test projects' TargetFrameworks, and FrameworkCoverageTests holds them in agreement.
      - name: "Unit tests"
        run: dotnet test tests/Hosting.Diagrid.Tests --no-build

      - name: "Integration tests"
        run: dotnet test tests/Hosting.Diagrid.IntegrationTests --no-build

      # Proves the opt-in tests skip without CATALYST_SMOKE_ENABLED: a skip, not a failure, and no account touched.
      - name: "Smoke tests (account-backed tests must skip; offline normaliser tests run)"
        run: dotnet test tests/Hosting.Diagrid.SmokeTests --no-build
